services:
  - type: web
    name: shynlimoveoutcleaning
    runtime: static
    repo: https://github.com/miralitys/shynlimoveoutcleaning.git
    branch: main
    buildCommand: node scripts/prepare-onrender-redirect.mjs
    staticPublishPath: ./redirect-origin
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__moveout_redirect/*
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*
        name: Cache-Control
        value: public, max-age=300, s-maxage=86400, stale-while-revalidate=604800
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
